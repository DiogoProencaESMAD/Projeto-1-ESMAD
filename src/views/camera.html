<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera</title>



    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="/styles/global.css">

    <!-- LUCIDE -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
</head>
<body class="theme-page-bg min-h-screen overflow-hidden">

<!-- HEADER -->
    <header class="theme-primary-bg shadow-sm">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
                <img src="/public/Huebly.png" alt="Huebly logo" class="w-40 h-15 object-contain">
                <h1 class="sr-only">Huebly</h1>
            </div>
        </div>
    </header>

  <!-- MAIN -->
    <main class="flex-1 w-full">

        <!-- CAMERA VIEW -->
        <section class="relative overflow-hidden w-full h-full bg-black">

            <!-- CAMERA IMAGE / VIDEO -->
            <video
                id="video"
                autoplay
                playsinline
                muted
                class="w-full h-full object-cover"
            ></video>
            <canvas id="canvas" class="hidden"></canvas>

            <!-- COLOR DETECTION -->
            <div
                class="theme-primary-bg absolute top-4 left-4 right-4 backdrop-blur-sm rounded-lg px-4 py-3 flex flex-col gap-3"
            >
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <div id="color-name" class="text-white text-lg font-semibold">
                            Color: Snow White
                        </div>
                        <div id="color-meta" class="text-white text-sm ">
                            #FFFFFF
                        </div>
                    </div>
                    <div id="swatch" class="w-12 h-12 bg-white border-2 border-black rounded"></div>
                </div>
                <div id="status" class="text-sm text-white opacity-90">Initializing...</div>
            </div>

            <!-- FREEZE BUTTON -->
            <div class="fixed bottom-24 left-0 right-0 flex justify-center">
                <button
                    id="freezeBtn"
                    type="button"
                    class="bg-red-500 hover:bg-red-600 active:scale-95 transition px-10 py-3 rounded-xl text-white font-semibold text-lg shadow-lg"
                >
                    FREEZE
                </button>
            </div>
        </section>
    </main>

<!-- BOTTOM NAVIGATION -->
    <nav class="theme-primary-bg theme-border fixed bottom-0 left-0 right-0 border-t">
        <div class="max-w-md mx-auto grid grid-cols-4 py-3">
            
            <!-- QUIZ BUTTON -->
            <button
                id="goQuiz"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="clipboard-list"></i>
                <span class="text-xs font-bold">
                    QUIZ
                </span>
            </button>
            
            <!-- CAMERA BUTTON -->
            <button
                id="goCamera"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <div class="theme-primary-soft-bg rounded-full p-2">
                    <i data-lucide="camera" class="theme-accent-text"></i>
                </div>
                <span class="text-xs font-bold">
                    CAMERA
                </span>
            </button>

            <!-- PROFILE BUTTON -->
            <button
                id="goProfile"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="user" class="text-white"></i>
                <span class="text-xs font-bold text-white">
                    PROFILE
                </span>
            </button>

            <!-- CHAT BUTTON -->
            <button
                id="goChat"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="message-square"></i>
                <span class="text-xs font-bold">
                    FORUM
                </span>
            </button>
        </div>
    </nav>

  <div id="chatOverlay" class="hidden fixed bottom-24 left-0 right-0 max-w-md mx-auto "></div>

  <script src="../shared/ntc.js"></script>

  <script type="module">
    import { initCamera } from "../controllers/cameraController.js"
    lucide.createIcons();
    initCamera()
  </script>
</body>
</html>
