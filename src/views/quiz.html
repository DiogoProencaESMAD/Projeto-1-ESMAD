<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="/styles/global.css">

    <!-- LUCIDE -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="theme-page-bg overflow-hidden">

  <!-- HEADER -->
    <header class="theme-primary-bg shadow-sm">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
              <img src="/public/Huebly.png" alt="Huebly logo" class="w-40 h-15 object-contain">
              <h1 class="sr-only">Huebly</h1>
            </div>
        </div>
    </header>

  <!-- MAIN -->
    <main class="flex-1 max-w-md mx-auto w-full p-4 pb-32">

        <!-- QUIZ FORM -->
        <div
            class="theme-surface-alt rounded-3xl p-6 md:p-8 flex flex-col items-center gap-10"
        >
            <!-- QUESTION NUMBER -->
            <p id="questionNumber" class="theme-accent-text text-lg font-bold">
                Question 1 of 10
            </p>

            <!-- QUESTION -->
            <h2
                id="question"
                class="theme-text text-center text-2xl font-medium"
            >
                Loading...
            </h2>

            <!-- ANSWERS -->
            <div id="answers" class="w-full flex flex-col gap-4"></div>

            <!-- RESULT -->
            <div id="result" class="w-full text-center space-y-2"></div>

            <!-- NEXT BUTTON -->
            <button id="nextBtn" type="button" class="theme-primary-bg theme-primary-hover mt-4 px-6 py-3 rounded-lg font-medium">Next</button>
        </div>
    </main>

<!-- BOTTOM NAVIGATION -->
    <nav class="theme-primary-bg theme-border fixed bottom-0 left-0 right-0 border-t">
        <div class="max-w-md mx-auto grid grid-cols-4 py-3">
            
            <!-- QUIZ BUTTON -->
            <button
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <div class="theme-primary-soft-bg rounded-full p-2">
                    <i data-lucide="clipboard-list" class="theme-accent-text"></i>
                </div>                
                <span class="text-xs font-bold">
                    QUIZ
                </span>
            </button>
            
            <!-- CAMERA BUTTON -->
            <button
                id="goCamera"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="camera"></i>
                <span class="text-xs font-bold">
                    CAMERA
                </span>
            </button>

            <!-- PROFILE BUTTON -->
            <button
                id="goProfile"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="user" class="text-white"></i>
                <span class="text-xs font-bold text-white">
                    PROFILE
                </span>
            </button>

            <!-- CHAT BUTTON -->
            <button
                id="goChat"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="message-square"></i>
                <span class="text-xs font-bold">
                    FORUM
                </span>
            </button>
        </div>
    </nav>

  <div id="chatOverlay" class="hidden fixed bottom-24 left-0 right-0 max-w-md mx-auto z-40"></div>

  <script type="module">
    import { initQuiz } from "../controllers/quizController.js"
    lucide.createIcons();
    initQuiz()
  </script>
</body>
</html>
