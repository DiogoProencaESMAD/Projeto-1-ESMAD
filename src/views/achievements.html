<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements</title>

    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="/styles/global.css">

    <!-- LUCIDE -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
</head>
<body class="bg-gray-100 text-slate-900 min-h-screen overflow-hidden">

<!-- HEADER -->
    <header class="bg-sky-500 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button
                type="button"
                aria-label="Profile"
                class="p-2 rounded-lg hover:bg-sky-400 transition"
                onclick="window.location.href='./profile.html'"
            >
                <i data-lucide="arrow-left" class="text-white w-6 h-6"></i>
            </button>
                <img src="/public/Huebly.png" alt="Huebly logo" class="w-40 h-15 object-contain">
                <h1 class="sr-only">Huebly</h1>
            </div>
        </div>
    </header>

  <!-- MAIN -->
    <main class="max-w-md mx-auto px-4 py-6 pb-32">

        <!-- LEVEL CARD -->
        <section class="bg-sky-500 rounded-3xl p-6 shadow-lg shadow-sky-500/30 mb-8">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p class="text-sm text-white font-semibold">
                        Current Level
                    </p>
                    <h3 id="levelValue" class="text-3xl font-bold text-white"></h3>
                </div>
                <div>
                    <span id="xpText" class="text-sm text-blue-200"></span>
                </div>
            </div>
            <div class="h-3 bg-black/30 rounded-full overflow-hidden">
                <div id="xpBar" class="h-full w-0 bg-white rounded-full"></div>
            </div>
        </section>

        <!-- ACHIEVEMENTS -->
        <section>
            <div class="flex items-center gap-3 mb-2">
                <i data-lucide="trophy" class="w-8 h-8 text-yellow-400"></i>
                <h2 class="text-4xl font-bold ">
                    Achievements
                </h2>
            </div>
            <br>
            <!-- ACHIEVEMENTS -->
            <div id="achievementsList" class="space-y-4 max-h-[60vh] overflow-y-auto"></div>
        </section>
    </main>

  <script type="module">
    import { initAchievements } from "../controllers/achievementController.js"
    lucide.createIcons();

    initAchievements()
  </script>
</body>
</html>
