<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- LUCIDE -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

</head>

<body class="bg-gray-100 min-h-screen">
  
  <!-- HEADER -->
    <header class="bg-sky-500 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="/public/Huebly.png" alt="Huebly logo" class="w-40 h-15 object-contain">
                <h1 class="sr-only">Huebly</h1>
            </div>
            <button
                id="settingsBtn"
                type="button"
                aria-label="Configurações"
                class="p-2 rounded-lg hover:bg-sky-400 transition"
            >
                <i data-lucide="settings" class="w-6 h-6 text-white"></i>
            </button>
        </div>
    </header>

<!-- CONTENT -->
    <main class="max-w-md mx-auto px-4 py-6 pb-32 space-y-6">

        <!-- PROFILE -->
        <div id="userInfo" class="flex items-center gap-4"></div>

        <!-- DALTONISM CARD -->
        <section class="bg-sky-100 rounded-3xl p-6 shadow-sm">
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                            <i data-lucide="eye" class="w-4 h-4 text-sky-500"></i>
                        </div>
                        <span class="text-sky-500 text-sm font-semibold">
                            Your vision type
                        </span>
                    </div>
                    <div id="daltonismType" class="text-2xl font-bold text-sky-500 mb-4" aria-live="polite"></div>
                </div>
                <div class="w-12 h-12 bg-green-100 border-2 border-sky-300 rounded-xl flex items-center justify-center">
                    <i data-lucide="eye" class="w-6 h-6 text-green-600"></i>
                </div>
            </div>
        </section>

        <!-- XP CARD -->
        <section class="bg-sky-100 rounded-3xl p-5 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <span class="uppercase text-sm font-semibold tracking-wide">
                    Experience
                </span>
                <span>
                    <strong id="xpValue" class="text-sky-500">0</strong>
                    <span id="xpTotal" class="text-sky-400">/ 100 XP</span>
                </span>
            </div>
            <div class="h-3 bg-white rounded-full overflow-hidden mb-5">
                <div id="xpProgress" class="h-full bg-sky-500 rounded-full" style="width:0%"></div>
            </div>
            <div class="flex items-center justify-between">
                <h3 class="uppercase text-sm font-medium tracking-wide text-sky-500">
                    Achievements
                </h3>
                <button
                    id="goAchievements"
                    type="button"
                    class="bg-sky-500 hover:bg-sky-600 text-white text-sm font-semibold px-6 py-3 rounded-lg transition"
                >
                    VIEW ALL
                </button>
            </div>
        </section>
    </main>

  <div id="chatOverlay" class="hidden"></div>

  <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-sky-500 border-t border-sky-400">
        <div class="max-w-md mx-auto grid grid-cols-4 py-3">
            
            <!-- QUIZ BUTTON -->
            <button
                id="goQuiz"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="clipboard-list"></i>
                <span class="text-xs font-bold">
                    QUIZZ
                </span>
            </button>
            
            <!-- CAMERA BUTTON -->
            <button
                id="goCamera"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="camera"></i>
                <span class="text-xs font-bold">
                    CAMERA
                </span>
            </button>

            <!-- PROFILE BUTTON -->
            <button
                id="goProfile"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <div class="bg-sky-300 rounded-full p-2">
                    <i data-lucide="user" class="text-white"></i>
                </div>
                <span class="text-xs font-bold text-white">
                    PROFILE
                </span>
            </button>

            <!-- CHAT BUTTON -->
            <button
                id="goChat"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="message-square"></i>
                <span class="text-xs font-bold">
                    FORUM
                </span>
            </button>
        </div>
    </nav>

  <div id="settingsModal" class="hidden">
    <div class="settings-content">
      <button id="closeSettingsBtn" type="button">✕</button>
      <h3>Settings</h3>
      <div class="settings-option">
        <label class="settings-label">Color Scheme</label>
        <div class="settings-row compact-row">
          <select id="colorSchemeSelect"></select>
          <button type="button" id="saveColorSchemeBtn">Change scheme</button>
        </div>
      </div>
      <div class="settings-option">
        <label class="settings-label">Display Mode</label>
        <div class="settings-row compact-row">
          <select id="displayModeSelect"></select>
          <button type="button" id="saveDisplayModeBtn">Change mode</button>
        </div>
        <p class="inline-note">This only changes light or dark surfaces and keeps the accessibility color scheme intact.</p>
      </div>
      <div class="settings-option">
        <button type="button" id="changePasswordBtn">Change Password</button>
      </div>
      <div class="settings-option">
        <button type="button" id="changeUsernameBtn">Change Username</button>
      </div>
      <div class="settings-option">
        <label class="settings-label" for="profileImageSelect">Profile picture</label>
        <div class="settings-row">
          <select id="profileImageSelect"></select>
          <div id="profileImagePreview" class="profile-avatar settings-avatar-preview" aria-hidden="true"></div>
          <button type="button" id="saveProfileImageBtn">Save picture</button>
        </div>
        <p class="inline-note">Choose one of the preset avatars.</p>
      </div>
      <div class="settings-option">
        <a class="settings-helper-link" href="./onboarding/select-daltonism.html">Change vision type</a>
        <p class="inline-note">Changing vision type switches the color scheme back to auto.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initProfile } from "../controllers/profileController.js"
    lucide.createIcons();

    initProfile()
  </script>
</body>
</html>
