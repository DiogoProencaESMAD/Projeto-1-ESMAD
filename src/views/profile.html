<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="/styles/global.css">

    <!-- LUCIDE -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

</head>

<body class="theme-page-bg min-h-screen overflow-x-hidden">
  
  <!-- HEADER -->
    <header class="theme-primary-bg shadow-sm">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="/public/Huebly.png" alt="Huebly logo" class="w-40 h-15 object-contain">
                <h1 class="sr-only">Huebly</h1>
            </div>
            <button
                id="settingsBtn"
                type="button"
                aria-label="Settings"
                class="p-2 rounded-lg theme-primary-hover transition"
            >
                <i data-lucide="settings" class="w-6 h-6 text-white"></i>
            </button>
        </div>
    </header>

<!-- CONTENT -->
    <main class="max-w-md mx-auto px-4 py-6 pb-32 space-y-6">

        <!-- PROFILE -->
        <div id="userInfo" class="flex items-center gap-4"></div>

        <!-- DALTONISM CARD -->
        <section class="theme-surface-alt rounded-3xl p-6 shadow-sm">
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                            <i data-lucide="eye" class="w-4 h-4 text-sky-500"></i>
                        </div>
                        <span class="theme-accent-text text-sm font-semibold">
                            Your vision type
                        </span>
                    </div>
                    <div id="daltonismType" class="theme-accent-text text-2xl font-bold mb-4" aria-live="polite"></div>
                </div>
                <div class="theme-primary-soft-bg theme-border w-12 h-12 border-2 rounded-xl flex items-center justify-center">
                    <i data-lucide="eye" class="theme-accent-text w-6 h-6"></i>
                </div>
            </div>
        </section>

        <!-- XP CARD -->
        <section class="theme-surface-alt rounded-3xl p-5 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <span class="uppercase text-sm font-semibold tracking-wide">
                    Experience
                </span>
                <span>
                    <strong id="xpValue" class="theme-accent-text">0</strong>
                    <span id="xpTotal" class="theme-muted-text">/ 100 XP</span>
                </span>
            </div>
            <div class="theme-progress-track h-3 rounded-full overflow-hidden mb-5">
                <div id="xpProgress" class="theme-progress-bar h-full rounded-full" style="width:0%"></div>
            </div>
            <div class="flex items-center justify-between">
                <h3 class="theme-accent-text uppercase text-sm font-medium tracking-wide">
                    Achievements
                </h3>
                <button
                    id="goAchievements"
                    type="button"
                    class="theme-primary-bg theme-primary-hover text-sm font-semibold px-6 py-3 rounded-lg transition"
                >
                    VIEW ALL
                </button>
            </div>
        </section>
    </main>

  <div id="chatOverlay" class="hidden fixed bottom-24 left-0 right-0 max-w-md mx-auto z-40"></div>

  <!-- BOTTOM NAVIGATION -->
    <nav class="theme-primary-bg theme-border fixed bottom-0 left-0 right-0 border-t">
        <div class="max-w-md mx-auto grid grid-cols-4 py-3">
            
            <!-- QUIZ BUTTON -->
            <button
                id="goQuiz"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="clipboard-list"></i>
                <span class="text-xs font-bold">
                    QUIZ
                </span>
            </button>
            
            <!-- CAMERA BUTTON -->
            <button
                id="goCamera"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="camera"></i>
                <span class="text-xs font-bold">
                    CAMERA
                </span>
            </button>

            <!-- PROFILE BUTTON -->
            <button
                id="goProfile"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <div class="theme-primary-soft-bg rounded-full p-2">
                    <i data-lucide="user" class="theme-accent-text"></i>
                </div>
                <span class="text-xs font-bold text-white">
                    PROFILE
                </span>
            </button>

            <!-- CHAT BUTTON -->
            <button
                id="goChat"
                type="button"
                class="flex flex-col items-center gap-1 text-white"
            >
                <i data-lucide="message-square"></i>
                <span class="text-xs font-bold">
                    FORUM
                </span>
            </button>
        </div>
    </nav>

  <div id="settingsModal" class="fixed inset-0 z-50 hidden bg-black/40 p-4 flex items-center justify-center">
    <div class="theme-surface w-full max-w-md max-h-[85vh] rounded-3xl shadow-xl overflow-y-auto">
        <!-- HEADER -->
        <div class="theme-border border-b">
            <div class="max-w-md mx-auto px-6 py-5 flex items-center justify-between">
                <h1 class="theme-text text-xl font-semibold">
                    Settings
                </h1>
                <button
                    id="closeSettingsBtn"
                    type="button"
                    aria-label="Close settings"
                    class="theme-text theme-surface-hover p-2 rounded-lg transition"
                >
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- CONTENT -->
        <main class="flex-1 w-full px-6 py-6 space-y-8">

            <!-- COLOR SCHEME -->
            <section class="space-y-3">
                <h2 class="theme-muted-text text-base font-medium">
                    Color Scheme
                </h2>
                <div class="flex flex-wrap gap-3 items-center">
                    <select
                        id="colorSchemeSelect"
                        class="theme-surface flex-1 min-w-[140px] h-12 px-4 rounded-xl border focus:outline-none focus:ring-2 focus:ring-sky-400"
                    ></select>
                    <button
                        id="saveColorSchemeBtn"
                        type="button"
                        class="theme-primary-bg theme-primary-hover flex-1 min-w-[140px] h-12 px-6 font-semibold rounded-xl transition"
                    >
                        Change Scheme
                    </button>
                </div>
            </section>

            <!-- DISPLAY MODE -->
            <section class="space-y-3">
                <h2 class="theme-muted-text text-base font-medium">
                    Display Mode
                </h2>
                <div class="flex flex-wrap gap-3 items-center">
                    <select
                        id="displayModeSelect"
                        class="theme-surface flex-1 min-w-[140px] h-12 px-4 rounded-xl border focus:outline-none focus:ring-2 focus:ring-sky-400"
                    ></select>
                    <button
                        id="saveDisplayModeBtn"
                        type="button"
                        class="theme-primary-bg theme-primary-hover flex-1 min-w-[140px] h-12 px-6 font-semibold rounded-xl transition"
                    >
                        Change Mode
                    </button>
                </div>
            </section>

            <!-- ACCOUNT -->
            <section class="space-y-3">
                <div class="flex flex-row flex-wrap gap-3">
                    <button
                        id="changeUsernameBtn"
                        type="button"
                        class="theme-primary-bg theme-primary-hover flex-1 min-w-[140px] py-3 font-semibold rounded-xl transition"
                    >
                        Change Username
                    </button>
                    <button
                        id="changePasswordBtn"
                        type="button"
                        class="theme-primary-bg theme-primary-hover flex-1 min-w-[140px] py-3 font-semibold rounded-xl transition"
                    >
                        Change Password
                    </button>
                    <button
                        id="logoutBtn"
                        type="button"
                        class="theme-primary-soft-bg theme-border flex-1 min-w-[140px] py-3 font-semibold rounded-xl border transition"
                    >
                        Logout
                    </button>
                </div>
            </section>

            <!-- PROFILE PICTURE -->
            <section class="space-y-4">
                <h2 class="theme-muted-text text-base font-medium">
                    Profile Picture
                </h2>
                <div class="flex flex-wrap gap-3 items-center">
                    <select
                        id="profileImageSelect"
                        class="theme-surface flex-1 min-w-[140px] h-12 px-4 rounded-xl border focus:outline-none focus:ring-2 focus:ring-sky-400"
                    ></select>
                    <button
                        id="saveProfileImageBtn"
                        type="button"
                        class="theme-primary-bg theme-primary-hover flex-1 min-w-[140px] h-12 px-6 font-semibold rounded-xl transition"
                    >
                        Save Picture
                    </button>
                </div>
                <div class="flex flex-col items-center">
                    <div id="profileImagePreview" class="theme-surface w-24 h-24 rounded-3xl border flex items-center justify-center text-2xl font-semibold">
                        Preview
                    </div>
                <button
                    id="changeVisionTypeBtn"
                    type="button"
                    class="theme-accent-text theme-accent-hover font-semibold transition"
                >
                    Change Vision Type
                </button>
                </div>
            </section>
        </main>
    </div>
  </div>

  <script type="module">
    import { initProfile } from "../controllers/profileController.js"
    lucide.createIcons();

    initProfile()
  </script>
</body>
</html>
